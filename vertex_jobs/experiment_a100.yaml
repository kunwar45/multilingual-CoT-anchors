# Vertex AI Custom Job — full experiment on A100 (80 GB).
# For 32B models (Qwen2.5-32B-Instruct, QwQ-32B, etc.)
#
# Do NOT edit this file directly for a run.
# Use scripts/create_vertex_run_config.py to generate a per-run copy in vertex_jobs/runs/.
#
# Placeholders replaced by create_vertex_run_config.py:
#   {{IMAGE_URI}}         Docker image URI
#   {{DISPLAY_NAME}}      owner-run-name slug
#   {{EXPERIMENT_NAME}}   experiment group (maps to GCS prefix)
#   {{HF_TOKEN}}          HuggingFace token (read from local .env)
#   {{OPENAI_API_KEY}}    OpenAI key for GPT-4o labeling (read from local .env)

workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-1g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    replicaCount: 1
    containerSpec:
      imageUri: "{{IMAGE_URI}}"
      command:
        - python
        - scripts/vertex_job_runner.py
        - "--"
        - python
        - -m
        - multicot.generate_rollouts
        - --dataset
        - mgsm
        - --languages
        - en
        - --provider
        - Local
        - --model
        - Qwen/Qwen2.5-32B-Instruct
        - --num_problems
        - "250"
        - --num_rollouts
        - "40"
        - --no_verify_language
        - --temperature
        - "0.6"
        - --top_p
        - "0.95"
      env:
        - name: VERTEX_DISPLAY_NAME
          value: "{{DISPLAY_NAME}}"
        - name: VERTEX_EXPERIMENT_NAME
          value: "{{EXPERIMENT_NAME}}"
        - name: GCS_OUTPUT_URI
          value: "gs://genai-1010101/multilingual-cot-anchors"
        - name: HF_TOKEN
          value: "{{HF_TOKEN}}"
        - name: OPENAI_API_KEY
          value: "{{OPENAI_API_KEY}}"
