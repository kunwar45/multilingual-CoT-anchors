# ABOUTME: Run parameters for the logprob_pivots pipeline: MGSM subset, Qwen2.5-0.5B base/Instruct pair, generation settings.
# ABOUTME: Mirrors the frozen defaults in src/logprob_pivots/experiment_config.py; never hardcode these in scripts.
seed: 42

dataset:
  name: juletxara/mgsm
  languages: ["en", "es", "fr", "de"]
  n_per_lang: 50

models:
  base: Qwen/Qwen2.5-0.5B
  reason: Qwen/Qwen2.5-0.5B-Instruct

generation:
  max_new_tokens: 256
  temperature: 0.2

runtime:
  device_preference: mps  # or "cuda" / "cpu"

scaffold:
  n_branches: 3
  pivot_top_k: 1

controls:
  config_path: configs/logprob_pivots/controls.yaml


