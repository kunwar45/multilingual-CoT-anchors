# ABOUTME: SPEC ONLY, NOT IMPLEMENTED — planned control/ablation settings for logprob_pivots pivot scoring.
# ABOUTME: No pipeline stage reads this file; the `enabled` flags below describe intent, not behavior.
#
# STATUS: unimplemented. Only `sentence_boundaries` describes something the code
# actually does today (pivot scores are computed over pysbd sentence spans, in
# src/logprob_pivots/sentence_segmentation.py) — and it does so unconditionally,
# not because of this file. The paraphrase and back-translation controls have no
# implementation at all. Toggling anything here changes nothing.
# Wire these into a stage before treating any `enabled: true` below as a fact.
controls:
  sentence_boundaries:
    enabled: true
    description: >
      All pivot scoring operates on sentence spans (not raw token positions),
      using character-level sentence boundaries from pysbd. This reduces
      tokenizer/script artifacts.

  paraphrase_within_language:
    enabled: true
    description: >
      Within a language, generate paraphrased versions of reasoning traces
      (different phrasing, same logical steps) and compare pivot locations
      and scores to the originals.
    sample_size: 20

  backtranslation_optional:
    enabled: false
    description: >
      Optional control: translate Target-CoT traces to English and back to the
      target language (back-translation), then compare pivot scores and
      accuracy. Enable only if you have capacity for extra model calls.


