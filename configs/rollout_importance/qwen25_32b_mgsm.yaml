# ABOUTME: Run parameters for rollout_importance stage 1: Qwen2.5-32B-Instruct on MGSM en/fr/zh (needs an A100-class GPU if self-hosted).
# ABOUTME: Pass via --config; keys are the long option names of generate_rollouts.py, and explicit CLI flags override them.

# A run varies three things — dataset, languages, model. Copy this file and change
# those to define a new run. Locally:
#   venv/bin/python -m src.rollout_importance.generate_rollouts --config configs/rollout_importance/qwen25_32b_mgsm.yaml
# On GCP (model self-hosted on the job's A100), inject via:
#   python scripts/vertex/create_vertex_run_config.py --template experiment_a100.yaml \
#       --run-config configs/rollout_importance/qwen25_32b_mgsm.yaml ...

dataset: mgsm
languages: en,fr,zh        # MGSM has no Arabic — use mmmlu (or mmath) for ar
model: Qwen/Qwen2.5-32B-Instruct
provider: Together         # Vertex templates override this with --provider Local

base_solution_type: correct
rollout_type: default

num_problems: 250
# 10 rollouts/chunk is a deliberately cheap first pass (~4x faster than 40). Accuracy
# resolution per chunk is 0.1 BEFORE compute_importance drops rollouts whose resampled
# chunk is too similar to the original (cos < 0.8), so expect only a few usable samples
# per chunk. Raise toward 40-100 before treating cross-language deltas as publishable.
num_rollouts: 10
temperature: 0.6
top_p: 0.95
# MGSM is grade-school math: traces run a few hundred tokens. 16384 bought nothing but
# expensive runaway generations in the tail. Raise this for MMATH/PolyMath, which are
# genuinely long-form.
max_tokens: 2048
seed: 44
