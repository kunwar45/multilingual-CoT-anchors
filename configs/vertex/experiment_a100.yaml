# ABOUTME: Vertex AI Custom Job template for full experiments on an A100-80GB (32B-class models).
# ABOUTME: Machine/infra concerns only — WHAT to run (dataset/languages/model) comes from the {{RUN_CONFIG}} track config.
# Vertex AI Custom Job — full experiment on A100 (80 GB).
# For 32B models (Qwen2.5-32B-Instruct, QwQ-32B, etc.)
#
# Do NOT edit this file directly for a run.
# Use scripts/vertex/create_vertex_run_config.py to generate a per-run copy in configs/vertex/runs/.
# The experiment itself (dataset, languages, model, sampling) lives in a
# configs/rollout_importance/ run config, injected as {{RUN_CONFIG}}; this template
# only pins the machine and forces --provider Local (model hosted on this GPU).
#
# Placeholders replaced by create_vertex_run_config.py:
#   {{IMAGE_URI}}         Docker image URI
#   {{RUN_CONFIG}}        configs/rollout_importance/<run>.yaml (dataset/languages/model)
#   {{DISPLAY_NAME}}      owner-run-name slug
#   {{EXPERIMENT_NAME}}   experiment group (maps to GCS prefix)
#   {{HF_TOKEN}}          HuggingFace token (read from local .env)
#   {{OPENAI_API_KEY}}    OpenAI key for GPT-4o labeling (read from local .env)

workerPoolSpecs:
  - machineSpec:
      machineType: a2-highgpu-1g
      acceleratorType: NVIDIA_TESLA_A100
      acceleratorCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 200
    replicaCount: 1
    containerSpec:
      imageUri: "{{IMAGE_URI}}"
      command:
        - python
        - scripts/vertex/vertex_job_runner.py
        - "--"
        - python
        - -m
        - src.rollout_importance.generate_rollouts
        - --config
        - "{{RUN_CONFIG}}"
        - --provider
        - Local
      env:
        - name: VERTEX_DISPLAY_NAME
          value: "{{DISPLAY_NAME}}"
        - name: VERTEX_EXPERIMENT_NAME
          value: "{{EXPERIMENT_NAME}}"
        - name: GCS_OUTPUT_URI
          value: "gs://genai-1010101/multilingual-cot-anchors"
        - name: HF_TOKEN
          value: "{{HF_TOKEN}}"
        - name: OPENAI_API_KEY
          value: "{{OPENAI_API_KEY}}"
