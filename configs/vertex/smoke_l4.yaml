# ABOUTME: Vertex AI Custom Job template for a fast infra smoke test on an L4 (7B-class models, 2 problems).
# ABOUTME: Machine/infra concerns only — WHAT to run comes from the {{RUN_CONFIG}} track config, shrunk to 2 problems x 5 rollouts.
# Vertex AI Custom Job — smoke test on L4 GPU (24 GB; 7B-class models).
# Purpose: fast infra/packaging sanity check, not a real experiment — the CLI
# overrides below shrink whatever run config is injected to 2 problems, 5 rollouts.
#
# Do NOT edit this file directly for a run.
# Use scripts/vertex/create_vertex_run_config.py to generate a per-run copy in configs/vertex/runs/.
# Pass a run config whose model fits an L4, e.g. configs/rollout_importance/qwen25_7b_mgsm.yaml.
#
# Placeholders replaced by create_vertex_run_config.py:
#   {{IMAGE_URI}}       Docker image URI
#   {{RUN_CONFIG}}      configs/rollout_importance/<run>.yaml (dataset/languages/model)
#   {{DISPLAY_NAME}}    owner-run-name slug
#   {{EXPERIMENT_NAME}} experiment group (maps to GCS prefix)
#   {{HF_TOKEN}}        HuggingFace token (read from local .env)

workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-8
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    replicaCount: 1
    containerSpec:
      imageUri: "{{IMAGE_URI}}"
      command:
        - python
        - scripts/vertex/vertex_job_runner.py
        - "--"
        - python
        - -m
        - src.rollout_importance.generate_rollouts
        - --config
        - "{{RUN_CONFIG}}"
        - --provider
        - Local
        - --num_problems
        - "2"
        - --num_rollouts
        - "5"
      env:
        - name: VERTEX_DISPLAY_NAME
          value: "{{DISPLAY_NAME}}"
        - name: VERTEX_EXPERIMENT_NAME
          value: "{{EXPERIMENT_NAME}}"
        - name: GCS_OUTPUT_URI
          value: "gs://genai-1010101/multilingual-cot-anchors"
        - name: HF_TOKEN
          value: "{{HF_TOKEN}}"
