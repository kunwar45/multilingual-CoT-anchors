# ABOUTME: Vertex AI Custom Job template for a fast infra smoke test on an L4 (Qwen2.5-7B, 2 problems).
# ABOUTME: Never edit or submit directly — scripts/vertex/create_vertex_run_config.py fills the placeholders into configs/vertex/runs/.
# Vertex AI Custom Job — smoke test on L4 GPU.
# Uses Qwen2.5-7B-Instruct (fits in 24 GB), 2 problems, 5 rollouts.
# Purpose: fast infra/packaging sanity check, not a real experiment.
#
# Do NOT edit this file directly for a run.
# Use scripts/vertex/create_vertex_run_config.py to generate a per-run copy in configs/vertex/runs/.
#
# Placeholders replaced by create_vertex_run_config.py:
#   {{IMAGE_URI}}       Docker image URI
#   {{DISPLAY_NAME}}    owner-run-name slug
#   {{EXPERIMENT_NAME}} experiment group (maps to GCS prefix)
#   {{HF_TOKEN}}        HuggingFace token (read from local .env)

workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-8
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    diskSpec:
      bootDiskType: pd-ssd
      bootDiskSizeGb: 100
    replicaCount: 1
    containerSpec:
      imageUri: "{{IMAGE_URI}}"
      command:
        - python
        - scripts/vertex/vertex_job_runner.py
        - "--"
        - python
        - -m
        - src.rollout_importance.generate_rollouts
        - --dataset
        - mgsm
        - --languages
        - en
        - --provider
        - Local
        - --model
        - Qwen/Qwen2.5-7B-Instruct
        - --num_problems
        - "2"
        - --num_rollouts
        - "5"
        - --no_verify_language
        - --temperature
        - "0.6"
        - --top_p
        - "0.95"
      env:
        - name: VERTEX_DISPLAY_NAME
          value: "{{DISPLAY_NAME}}"
        - name: VERTEX_EXPERIMENT_NAME
          value: "{{EXPERIMENT_NAME}}"
        - name: GCS_OUTPUT_URI
          value: "gs://genai-1010101/multilingual-cot-anchors"
        - name: HF_TOKEN
          value: "{{HF_TOKEN}}"
